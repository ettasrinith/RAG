<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Knowledge Hub — RAG Platform</title>
<meta name="description" content="Production-grade RAG platform: search, chat, index, and discover research papers." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/css/tokens.css" />
<link rel="stylesheet" href="/static/css/base.css" />
<link rel="stylesheet" href="/static/css/layout.css" />
<link rel="stylesheet" href="/static/css/components.css" />
<link rel="stylesheet" href="/static/css/search.css" />
<link rel="stylesheet" href="/static/css/chat.css" />
<link rel="stylesheet" href="/static/css/views.css" />
<link rel="stylesheet" href="/static/css/graph.css" />
<link rel="stylesheet" href="/static/css/toasts.css" />
<link rel="stylesheet" href="/static/css/responsive.css" />
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>

<!-- ═══ SIDEBAR ═════════════════════════════════════ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <a class="brand" href="#">
      <span class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M12 6v7"/><path d="M9 9l3-3 3 3"/></svg>
      </span>
      <span class="brand-text">Knowledge<span>Hub</span></span>
    </a>
  </div>

  <nav class="sidebar-nav">
    <button class="nav-item active" data-view="dashboard">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      <span>Dashboard</span>
    </button>
    <button class="nav-item" data-view="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span>Search</span>
      <span class="nav-badge" id="search-badge">/</span>
    </button>
    <button class="nav-item" data-view="chat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Chat</span>
    </button>
    <button class="nav-item" data-view="index">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span>Index</span>
    </button>
    <button class="nav-item" data-view="research">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <span>Research</span>
    </button>
    <button class="nav-item" data-view="graph">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><circle cx="5" cy="19" r="2"/><line x1="12" y1="9" x2="12" y2="15"/><line x1="16.5" y1="5.5" x2="14" y2="8"/><line x1="7.5" y1="5.5" x2="10" y2="8"/><line x1="16.5" y1="18.5" x2="14" y2="16"/><line x1="7.5" y1="18.5" x2="10" y2="16"/></svg>
      <span>Graph</span>
    </button>
    <button class="nav-item" data-view="settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <span>Settings</span>
    </button>
    <button class="nav-item" data-view="admin">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
      <span>Admin</span>
    </button>
  </nav>

  <div class="sidebar-footer">
    <div class="status-indicator" id="sidebar-status">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-label" id="status-text">Ready</span>
    </div>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
      <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</aside>

<!-- ═══ OVERLAY (mobile) ════════════════════════════ -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<!-- ═══ MAIN CONTENT ═══════════════════════════════ -->
<main class="main-content">
  <!-- Views are loaded dynamically from /static/views/ -->
  <div id="views-container"></div>
</main>

<!-- ═══ TOASTS ═══════════════════════════════════════ -->
<div id="toast-container"></div>

<!-- Component loader and app logic -->
<script src="/static/js/state.js"></script>
<script src="/static/js/search.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/index.js"></script>
<script src="/static/js/research.js"></script>
<script src="/static/js/graph.js"></script>
<script src="/static/js/settings.js"></script>
<script src="/static/js/admin.js"></script>
<script src="/static/js/init.js"></script>
</body>
</html>
