<!-- Chat View -->
<section class="view" id="view-chat">
  <div class="view-header">
    <div>
      <span class="eyebrow">Retrieval-Augmented Generation</span>
      <h1>Chat with your <span class="gradient-text">Library</span></h1>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost btn-sm" id="chat-new-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New chat
      </button>
    </div>
  </div>

  <div class="chat-layout">
    <!-- Sessions sidebar (left) -->
    <aside class="chat-sessions" id="chat-sessions">
      <div class="sessions-header">
        <h4>Sessions</h4>
        <button class="btn btn-ghost btn-sm" id="chat-new-session-btn" title="New session">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div class="sessions-list" id="sessions-list">
        <div class="empty-sm">No sessions yet</div>
      </div>
    </aside>

    <div class="chat-main">
      <div class="chat-messages" id="chat-messages">
        <div class="welcome-msg" id="chat-welcome">
          <div class="welcome-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <h3>Ask your knowledge base</h3>
          <p>I answer questions based on your indexed documents and research papers.</p>
          <div class="suggestions" id="chat-suggestions">
            <button class="suggestion-chip" data-q="What documents are indexed?">What documents are indexed?</button>
            <button class="suggestion-chip" data-q="Summarize the latest research">Summarize the latest research</button>
            <button class="suggestion-chip" data-q="What topics do my documents cover?">What topics do my documents cover?</button>
          </div>
        </div>
      </div>

      <div class="chat-input-area">
        <div class="chat-attachment-bar" id="chat-attachment-bar" style="display:none">
          <span class="attachment-chip" id="attachment-chip"></span>
          <button class="btn btn-ghost btn-sm" id="chat-attachment-remove" title="Remove attachment">×</button>
        </div>
        <div class="chat-controls-row">
          <div class="chat-scope-selector">
            <button class="scope-btn active" data-scope="main">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
              Knowledge
            </button>
            <button class="scope-btn" data-scope="research">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
              Research
            </button>
          </div>
          <label class="agent-mode-toggle" title="Enable Agent Mode for multi-step reasoning with tools">
            <input type="checkbox" id="agent-mode-toggle" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-label">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
              Agent
            </span>
          </label>
        </div>
        <div class="chat-input-wrap">
          <button class="btn btn-ghost btn-sm chat-attach-btn" id="chat-attach-btn" title="Attach file (PDF, text)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input type="file" id="chat-file-input" accept=".pdf,.txt,.md,.py,.js,.ts,.json,.csv" hidden />
          <input type="text" id="chat-input" placeholder="Ask a question about your knowledge…" />
          <button class="btn btn-primary" id="chat-send-btn" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Sources panel (right side) -->
    <aside class="chat-sources" id="chat-sources">
      <div class="sources-header">
        <h4>Sources</h4>
        <span class="sources-count" id="sources-count">0</span>
      </div>
      <div class="sources-list" id="sources-list">
        <div class="empty-sm">No sources yet. Ask a question to see sources.</div>
      </div>
    </aside>
  </div>
</section>
