<!-- Dashboard View -->
<section class="view active" id="view-dashboard">
  <div class="view-header">
    <div>
      <span class="eyebrow">Overview</span>
      <h1>Dashboard</h1>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost btn-sm" id="dashboard-refresh" title="Refresh">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        Refresh
      </button>
    </div>
  </div>

  <div class="stats-grid" id="dash-stats">
    <div class="stat-card glass">
      <div class="stat-icon" style="--stat-color: var(--primary)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      </div>
      <div class="stat-body">
        <span class="stat-value" id="stat-docs">—</span>
        <span class="stat-label">Documents Indexed</span>
      </div>
    </div>
    <div class="stat-card glass">
      <div class="stat-icon" style="--stat-color: var(--accent)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <div class="stat-body">
        <span class="stat-value" id="stat-repos">—</span>
        <span class="stat-label">Repositories</span>
      </div>
    </div>
    <div class="stat-card glass">
      <div class="stat-icon" style="--stat-color: var(--amber)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      </div>
      <div class="stat-body">
        <span class="stat-value" id="stat-papers">—</span>
        <span class="stat-label">Research Papers</span>
      </div>
    </div>
    <div class="stat-card glass">
      <div class="stat-icon" style="--stat-color: var(--purple)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="stat-body">
        <span class="stat-value" id="stat-chats">—</span>
        <span class="stat-label">Model</span>
      </div>
    </div>
  </div>

  <div class="dash-grid">
    <div class="dash-card glass">
      <div class="dash-card-header">
        <h3>Repositories by document count</h3>
      </div>
      <div class="dash-card-body" id="dash-repo-chart">
        <div class="empty-sm">Loading…</div>
      </div>
    </div>
    <div class="dash-card glass">
      <div class="dash-card-header">
        <h3>Recent activity</h3>
      </div>
      <div class="dash-card-body" id="dash-activity">
        <div class="empty-sm">No recent activity</div>
      </div>
    </div>
  </div>

  <div class="dash-card glass quick-actions-card">
    <div class="dash-card-header"><h3>Quick Actions</h3></div>
    <div class="quick-actions">
      <button class="qa-btn" data-view="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Search documents</span>
      </button>
      <button class="qa-btn" data-view="chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Ask a question</span>
      </button>
      <button class="qa-btn" data-view="index">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>Index new data</span>
      </button>
      <button class="qa-btn" data-view="research">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span>Discover papers</span>
      </button>
    </div>
  </div>
</section>
