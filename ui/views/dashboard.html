<section class="view active" id="view-dashboard">
  <div class="view-header">
    <div>
      <div class="eyebrow">Overview</div>
      <h1>Dashboard</h1>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost btn-sm" id="dashboard-refresh" title="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Refresh
      </button>
    </div>
  </div>

  <!-- Compact stat strip -->
  <div class="stat-strip" id="dash-stats">
    <div class="stat-inline" style="--stat-color: var(--primary-soft); --stat-fg: var(--primary);">
      <div class="stat-inline-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </div>
      <span class="stat-inline-value" id="stat-docs">—</span>
      <span class="stat-inline-label">Documents</span>
    </div>
    <div class="stat-inline" style="--stat-color: var(--accent-soft); --stat-fg: var(--accent);">
      <div class="stat-inline-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v6"/><path d="M2 12h20"/><path d="M2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6"/></svg>
      </div>
      <span class="stat-inline-value" id="stat-repos">—</span>
      <span class="stat-inline-label">Repos</span>
    </div>
    <div class="stat-inline" style="--stat-color: var(--amber-soft); --stat-fg: var(--amber);">
      <div class="stat-inline-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </div>
      <span class="stat-inline-value" id="stat-papers">—</span>
      <span class="stat-inline-label">Papers</span>
    </div>
    <div class="stat-inline" style="--stat-color: var(--purple-soft); --stat-fg: var(--purple);">
      <div class="stat-inline-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <span class="stat-inline-value" id="stat-model" style="font-size:12px;">—</span>
      <span class="stat-inline-label">Model</span>
    </div>
  </div>

  <!-- Main 2-column grid (collapsible panels) -->
  <div class="dash-main">
    <div class="dash-panel" data-collapsible>
      <div class="dash-panel-header collapse-toggle">
        <h3>Repositories by document count</h3>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="dash-panel-body collapsible" id="dash-repo-chart">
        <div class="state-sm">Loading…</div>
      </div>
    </div>
    <div class="dash-panel" data-collapsible>
      <div class="dash-panel-header collapse-toggle">
        <h3>System status</h3>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="dash-panel-body collapsible" id="dash-activity">
        <div class="state-sm">No recent activity</div>
      </div>
      <div class="dash-panel-footer">
        <div class="quick-actions-inline">
          <button class="qa-btn-sm" data-nav="search" title="Search documents">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
          <button class="qa-btn-sm" data-nav="chat" title="Ask a question">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button class="qa-btn-sm" data-nav="index" title="Index new data">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </button>
          <button class="qa-btn-sm" data-nav="research" title="Discover papers">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
